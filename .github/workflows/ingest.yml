name: Daily ingest

on:
  schedule:
    # Four times daily (~every 6h). Still sparse vs hourly to stay polite
    # to free Yahoo / FRED / World Bank limits.
    # 00:00 UTC · Asia session wrap
    # 06:00 UTC · morning macro + prior session
    # 12:00 UTC · Europe midday / US open approach
    # 18:00 UTC · US cash session afternoon
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply schema migrations
        run: npm run db:migrate

      - name: Ingest FRED
        run: npm run ingest:fred
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Ingest cross-country (World Bank fallback on Actions)
        run: npm run ingest:imf

      - name: Ingest markets (Yahoo)
        run: npm run ingest:markets

      - name: Ingest policy events (Fed/ECB/BoE RSS)
        run: npm run ingest:events

      - name: Compute signals
        run: npm run compute:signals

      - name: Evaluate forecast hit rates
        run: npm run compute:forecasts

      - name: Evaluate alert rules
        run: npm run compute:alerts
