name: Daily ingest

on:
  schedule:
    # ~06:00 UTC daily — after US equity cash close + FRED publish lag
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Ingest FRED
        run: npm run ingest:fred
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # IMF DataMapper is often 403 from GitHub cloud IPs → World Bank fallback.
      # Manual `make ingest-manual` writes true IMF; upserts preserve IMF over World Bank.
      - name: Ingest cross-country (IMF / World Bank)
        run: npm run ingest:imf

      - name: Ingest markets (Yahoo)
        run: npm run ingest:markets

      - name: Compute signals
        run: npm run compute:signals

      # Intentionally no Gemini/Groq steps here.
      # Free AI credits stay local-only: `make compute-briefs` / `TELL_AI_EVAL=1 make test-eval`
