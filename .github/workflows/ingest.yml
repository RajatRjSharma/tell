name: Daily ingest

on:
  schedule:
    # Twice daily, kept sparse for free Yahoo/FRED/World Bank limits.
    # 06:00 UTC: morning refresh (macro + prior session)
    # 21:30 UTC: after US cash equity close (~16:00 ET)
    - cron: "0 6 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply schema migrations
        run: npm run db:migrate

      - name: Ingest FRED
        run: npm run ingest:fred
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Ingest cross-country (World Bank fallback on Actions)
        run: npm run ingest:imf

      - name: Ingest markets (Yahoo)
        run: npm run ingest:markets

      - name: Ingest policy events (Fed/ECB/BoE RSS)
        run: npm run ingest:events

      - name: Compute signals
        run: npm run compute:signals

      - name: Evaluate forecast hit rates
        run: npm run compute:forecasts

      - name: Evaluate alert rules
        run: npm run compute:alerts
